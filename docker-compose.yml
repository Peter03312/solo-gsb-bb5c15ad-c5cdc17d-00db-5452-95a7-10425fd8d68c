services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collation
      POSTGRES_PASSWORD: collation
      POSTGRES_DB: collation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collation -d collation"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://collation:collation@db:5432/collation"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
